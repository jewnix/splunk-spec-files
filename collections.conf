# DO NOT EDIT THIS FILE!
# Please make all changes to files in $SPLUNK_HOME/etc/system/local.
# To make changes, copy the section/stanza you want to change from $SPLUNK_HOME/etc/system/default
# into ../local and edit there.
#
# Configuration for KV Store collections
#

##############
# defaults for all collection
##############

[default]
type = undefined
profilingEnabled = false
profilingThresholdMs = 1000
replicate = false
replication_dump_strategy = auto
replication_dump_maximum_file_size = 10240

[SavedSearchHistory]
type = internal_cache

# Internal scheduler next-run map checkpoint state.
[SchedulerSearchState]
type = internal_cache

# Internal scheduler summary search concurrency checkpoint state.
[SchedulerSummaryInProgressState]
type = internal_cache

[SearchHeadClusterHealthStates]
type = internal_cache

[SearchHistory]
accelerated_fields.history = { "timestamp":1 }

[SamlIdpCerts]
disabled = true

[SSLCertificates]
disabled = true

[SearchJobStatus]
accelerated_fields.user = { "user":1 }
accelerated_fields.app = { "app":1 }
accelerated_fields.savedsearchname = { "savedsearchname":1 }

[backup_details_for_lookups]
field.lookupName = string
field.app = string
field.backupSize = number
field.currentLimit = number
field.owner = string

[SearchHeadClusterMemberInfo]
type = internal_cache

[RecentlyViewedKO]

[HomePageAdminConfig]

[HomePage]

[C3Eligibility]

[Favorites]
accelerated_fields.id = {"id": 1, "app": 1}
accelerated_fields.title = {"title": 1}

[KOFavorites]
accelerated_fields.title = {"title": 1}

# Used as storage for Token authorization
[JsonWebTokensV1]
disabled = true

[LookupDumpDistribution]
type = internal_cache


[Spl2Modules]

[Spl2Permissions]

[DistributedLeases]

[LoggedOutSessionTokens]
disabled = true
# The unique token uid is stored as _key
field.expiration = number
field.inserted = number
accelerated_fields.ac_inserted = {"inserted" : 1}

# Used as storage for SAML user's TTL when AuthExts or AQRs are enabled
[SAMLUserLastAccessedTimestamp]

# Used as storage for OAuth2 authorization codes during the authorization code flow
[OAuth2AuthorizationCodes]

[QueuedStatisticsReplication]

# Used by KV Store migration state tracking.
[migration_state]
disabled = true

# Used by Metadata Catalog sidecar for pipeline tracking
[MDCPipelineCursor]

[MDCMetadataProgress]

[MDCSchemaProgress]

[MDCIndexDiscoveryState]

[MDCCommitGuard]
