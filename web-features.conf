[feature:search_auto_format]
# CAUTION: Do not change this setting.
# Determines whether or not comments are auto-formatted by the search editor's auto-formatter.
enable_autoformatted_comments = false

[feature:ui_prefs_optimizations]
# CAUTION: Do not change this setting.
# Determines whether or not Splunk Web will optimize performance of the API related to ui-prefs.conf.
optimize_ui_prefs_performance = true

[feature:splunk_web_optimizations]
# CAUTION: Do not change this setting.
# Determines whether or not Splunk Web will optimize performance when generating the app bar.
enable_app_bar_performance_optimizations = true

# CAUTION: Do not change this setting.
# Splunk Web will not optimize performance when generating the app bar for this comma separated list of apps.
bypass_app_bar_performance_optimizations_apps = ""

# CAUTION: Do not change this setting.
# Determines whether or not Splunk Web will optimize search bar load time when loading the search page.
enable_search_bar_performance_optimizations = true

# CAUTION: Do not change this setting.
# Determines whether or not Splunk Web will optimize fetching details for saved searches.
enable_saved_search_pageload_optimization = true

# CAUTION: Do not change this setting.
# Determines whether Splunk Web optimizes rendering the messages list when it loads some Splunk Web pages.
enable_messages_list_performance_optimizations = true

[feature:spotlight_search]
# Determines whether Splunk Web displays the Spotlight Search bar in the Settings menu.
enable_spotlight_search = true

[feature:search_sidebar]
# Determines whether Splunk Web displays preview links and
# Splunk Observability preview sidebar in Search & Reporting
enable_sidebar_preview = true

[feature:field_filters]
# Determines whether Splunk Web displays field filters.
# A value of "false" means that field filters are not visible in Splunk Web.
enable_field_filters_ui = true

[feature:authentication_oauth]
# Determines whether Splunk Web displays the OAuth page.
# A value of "false" means that Splunk Web does not display the OAuth page.
enable_authentication_oauth_ui = true

[feature:identity_sidecar_scim]
# Determines whether Splunk Web displays Automated User Management in SAML Configuration dialog.
enabled = true

[feature:web_access_policy]
# Whether or not Splunk Web applies the role- and path-based redirect rules
# configured in this stanza to authenticated user interface (UI) requests.
* NOTE: Do not change this setting unless instructed to do so by Splunk Support.
enabled = false

# Semicolon-separated role names that let users navigate without redirection,
# except for paths that match 'denylist_url_patterns'. 
# Users without any effective role in this list are redirected to 'target_url'.
* NOTE: Do not change this setting unless instructed to do so by Splunk Support.
required_roles =

# Semicolon-delimited direct role names that bypass this policy entirely.
# Directly assigned, semicolon-separated roles that bypass the policy.
* NOTE: Do not change this setting unless instructed to do so by Splunk Support.
bypass_roles =

# Internal relative URL to which Splunk Web redirects users.
# Must be a concrete URL, not a pattern.
* NOTE: Do not change this setting unless instructed to do so by Splunk Support.
target_url =

# Semicolon-separated path patterns that redirect users with a matching role
# in 'required_roles'
# Wildcard "*" matches zero or more path characters.
* NOTE: Do not change this setting unless instructed to do so by Splunk Support.
denylist_url_patterns =

[feature:system_namespace_redirection]
# CAUTION: Do not change this setting.
# Determines whether Splunk Web redirects pages with system app namespace.
enable_system_namespace_redirection = true



[feature:appserver]

# Determines the version of python used by appserver.
python.required = latest

[feature:federated_search]
# Determines whether Splunk Web allows IPv6 address/CIDR inputs in forms.
enable_ipv6_validations = true
# Determines whether Splunk Web keeps legacy Federated Search for Amazon S3
# available when Federated Analytics is enabled.
enable_legacy_fss3_ui = false

[feature:federated_analytics]
# Determines whether Splunk Web displays the Federated Analytics for Amazon 
# Security Lake workflow.
enable_fa_asl = false


[feature:knowledge_object_favorites]
# Determines whether or not dashboards favorites is enabled.
enable_dashboards_favorites = true
# Determines whether or not reports favorites is enabled.
enable_reports_favorites = true


[feature:search_ai_assistant]
# Lets a user access the Splunk AI Assistant for SPL in the Search app in Splunk Web.
enable_search_ai_assistant = true
# Whether or not the Splunk AI assistant toggle is displayed in the Search app
# in Splunk Web.
# This setting is managed by administrators and is turned on by default.
admin_search_ai_assistant_allowed = true

[feature:spl2]
# Determines whether Splunk Web enables SPL2.
enable_spl2 = true

[feature:splunk_oauth_clients]
# Determines whether Splunk Web displays UI pages/elements related to Splunk OAuth Clients.
# A value of "false" means that Splunk OAuth clients are not visible in Splunk Web.
enable_splunk_oauth_clients_ui = false

[feature:appserver_security]
# Whether or not Splunk Web blocks custom Mako templates shipped by apps.
# Regardless of this setting, Splunk Web always allows first-party templates in
# the $SPLUNK_HOME/share/splunk/search_mrsparkle directory.
deactivate_custom_mako_templates = false

# Whether or not Splunk Web blocks custom CherryPy controllers shipped by apps.
# This setting only affects the /custom/<app>/* directory. It does not affect
# REST endpoints, views, dashboards, and static assets.
deactivate_custom_cherrypy_controllers = false

[feature:splunk_service_credentials]
# Determines whether Splunk Web displays pages related to service credentials.
# Service credentials are used by apps and data inputs to authenticate with external systems.
# A value of "false" means that service credentials are not visible in Splunk Web.
enable_splunk_service_credentials_ui = true

[feature:cron_schedule_restrictions]
# Whether or not to turn on role-based cron schedule restrictions
# in Splunk Web, on the Resources tab of the "Roles" page.
# When turned on, roles in Splunk Web can define minimum schedule intervals
# and restrict custom cron expressions. 
enable_cron_schedule_restrictions_ui = false

[feature:hec_mdl_raw_datasets]
# Determines whether Splunk Web displays Machine Data Lake (MDL) raw datasets
# as available indexes when configuring data inputs for the HTTP Event Collector (HEC).
# A value of "false" means that MDL raw datasets are not visible as available
# indexes when configuring a HEC token on the "Add Data" pages.
enable_hec_mdl_raw_datasets_ui = true

[feature:guided_data_inputs]
# Home address of GDI's web service
gdi_web_service_home = https://guides.splunk.com/v1
